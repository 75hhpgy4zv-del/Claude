<title>Plate Counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: a phone app shell. One scrolling screen per tab, a bottom tab bar, a floating add button, and bottom sheets for every task. */
:root {
  --bg: #f4f4f6;
  --card: #ffffff;
  --sunk: #efeff2;
  --ink: #111114;
  --ink2: #5c5c66;
  --muted: #8e8e97;
  --line: #e6e6ea;
  --btn: #111114;
  --btn-ink: #ffffff;
  --protein: #d93d6b;
  --carbs: #c98900;
  --fat: #2f6fe8;
  --flame: #f06a1d;
  --good: #1f9d55;
  --over: #d63a2f;
  --shadow: 0 1px 2px rgba(17, 17, 20, .04), 0 6px 20px rgba(17, 17, 20, .06);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
  --r-card: 22px;
  --r-sm: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --card: #1c1c1e; --sunk: #2a2a2e; --ink: #f5f5f7; --ink2: #aeaeb6; --muted: #7c7c85;
    --line: #2c2c30; --btn: #f5f5f7; --btn-ink: #000000;
    --protein: #e0588a; --carbs: #bf8710; --fat: #5b8cec; --flame: #ff8a3d; --good: #46c37b; --over: #ff6b5e;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --card: #1c1c1e; --sunk: #2a2a2e; --ink: #f5f5f7; --ink2: #aeaeb6; --muted: #7c7c85;
  --line: #2c2c30; --btn: #f5f5f7; --btn-ink: #000000;
  --protein: #e0588a; --carbs: #bf8710; --fat: #5b8cec; --flame: #ff8a3d; --good: #46c37b; --over: #ff6b5e;
  --shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 30px; font-weight: 800; letter-spacing: -.02em; text-wrap: balance; }
h2 { font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink2); }
.small { font-size: 13px; }
.ico { width: 20px; height: 20px; flex: none; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.shell { max-width: 480px; margin: 0 auto; padding: 0 16px; padding-block: 12px 150px; min-height: 100%; }
.view { display: flex; flex-direction: column; gap: 16px; }

.card { background: var(--card); border-radius: var(--r-card); box-shadow: var(--shadow); padding: 18px; }
.card.flat { box-shadow: none; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* Header */
.apphead { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 4px; }
.logo { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 21px; letter-spacing: -.02em; }
.logo-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--btn); color: var(--btn-ink); display: grid; place-items: center; }
.logo-mark svg { width: 18px; height: 18px; }
.streak { display: inline-flex; align-items: center; gap: 5px; background: var(--card); box-shadow: var(--shadow); border-radius: 999px; padding: 6px 12px 6px 9px; font-weight: 700; }
.streak svg { color: var(--flame); width: 18px; height: 18px; }

/* Week strip */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0 8px; border-radius: 16px; }
.wd[aria-current="date"] { background: var(--card); box-shadow: var(--shadow); }
.wd .dow { font-size: 12px; font-weight: 600; color: var(--muted); }
.wd .dial { position: relative; width: 38px; height: 38px; }
.wd .dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.wd .dial span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 14px; font-weight: 700; }
.wd:disabled { opacity: .35; cursor: default; }

/* Summary cards */
.hero { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 22px; }
.hero .num { font-size: 46px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
.hero .lbl { font-size: 15px; color: var(--ink2); margin-top: 6px; font-weight: 500; }
.hero .sub { font-size: 13px; color: var(--muted); margin-top: 10px; }
.ring { position: relative; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
.ring .mid { position: absolute; inset: 0; display: grid; place-items: center; }
.ring .mid svg { width: 26px; height: 26px; transform: none; }
.mcard .ring .mid svg { width: 20px; height: 20px; }
.macros3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.mcard { padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.mcard .num { font-size: 21px; font-weight: 800; letter-spacing: -.02em; }
.mcard .lbl { font-size: 12.5px; color: var(--ink2); font-weight: 500; }
.mcard .ring { align-self: center; }

.sechead { display: flex; align-items: baseline; justify-content: space-between; padding-top: 6px; }

/* Meal cards */
.meal { display: flex; gap: 12px; padding: 10px; align-items: stretch; text-align: left; width: 100%; }
.thumb { width: 84px; height: 84px; border-radius: 16px; object-fit: cover; background: var(--sunk); flex: none; display: grid; place-items: center; color: var(--muted); overflow: hidden; }
.thumb svg { width: 28px; height: 28px; }
.meal .body { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
.meal .top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.meal .name { font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.chip { font-size: 12px; font-weight: 600; color: var(--ink2); background: var(--sunk); border-radius: 999px; padding: 3px 8px; white-space: nowrap; flex: none; }
.kcal-line { display: flex; align-items: center; gap: 5px; font-weight: 700; font-size: 15px; }
.kcal-line svg { width: 16px; height: 16px; color: var(--ink); }
.mrow { display: flex; gap: 12px; font-size: 13px; color: var(--ink2); font-weight: 600; flex-wrap: wrap; }
.mrow span { display: inline-flex; align-items: center; gap: 4px; }
.mrow svg { width: 14px; height: 14px; }
.c-protein { color: var(--protein); } .c-carbs { color: var(--carbs); } .c-fat { color: var(--fat); }
.analyzing { position: relative; }
.analyzing::after { content: ""; position: absolute; top: 10px; left: 10px; height: 84px; width: 84px; border-radius: 16px; background: linear-gradient(180deg, transparent 0%, rgba(255,255,255,.55) 50%, transparent 100%); background-size: 100% 200%; animation: scan 1.6s ease-in-out infinite; }
@keyframes scan { 0% { background-position: 0 -100%; } 100% { background-position: 0 100%; } }
.bar-ind { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; position: relative; }
.bar-ind i { position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 3px; background: var(--ink); animation: slide 1.3s ease-in-out infinite; }
@keyframes slide { 0% { left: -40%; } 100% { left: 100%; } }
@media (prefers-reduced-motion: reduce) { .analyzing::after, .bar-ind i { animation: none; } .bar-ind i { left: 0; width: 100%; opacity: .35; } }

.empty { text-align: center; padding: 28px 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.empty .art { width: 56px; height: 56px; border-radius: 18px; background: var(--sunk); display: grid; place-items: center; color: var(--ink2); }
.empty .art svg { width: 28px; height: 28px; }
.empty b { font-size: 16px; }
.empty p { color: var(--ink2); font-size: 14px; max-width: 30ch; }

/* Buttons & inputs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; padding: 13px 20px; font-weight: 700; font-size: 15px; background: var(--btn); color: var(--btn-ink); }
.btn.block { width: 100%; padding: 16px 20px; font-size: 16px; }
.btn.ghost { background: var(--sunk); color: var(--ink); }
.btn.line { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.danger { background: transparent; color: var(--over); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.sm { padding: 8px 14px; font-size: 13.5px; }
.btn:disabled { opacity: .45; cursor: default; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 120px; }
.field label { font-size: 13px; font-weight: 600; color: var(--ink2); }
.input { width: 100%; border: 0; border-radius: var(--r-sm); background: var(--sunk); padding: 13px 14px; font-size: 16px; outline: none; }
.input:focus { box-shadow: inset 0 0 0 1.5px var(--ink); }
textarea.input { resize: vertical; min-height: 80px; }
.seg { display: flex; background: var(--sunk); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { flex: 1; padding: 7px 10px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--ink2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.err { color: var(--over); font-size: 14px; font-weight: 500; }
.note { font-size: 13.5px; color: var(--ink2); background: var(--sunk); border-radius: var(--r-sm); padding: 10px 12px; }

/* Tab bar & FAB */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr) 76px; align-items: center; padding: 6px 8px 8px; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--muted); padding: 4px 0; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--ink); }
.fab { width: 58px; height: 58px; border-radius: 50%; background: var(--btn); color: var(--btn-ink); display: grid; place-items: center; justify-self: center; margin-top: -26px; box-shadow: 0 8px 22px rgba(0,0,0,.25); }
.fab svg { width: 28px; height: 28px; }

/* Sheets */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.42); display: flex; align-items: flex-end; justify-content: center; animation: fade .18s ease-out; }
.sheet { background: var(--bg); width: 100%; max-width: 480px; max-height: 92%; overflow-y: auto; border-radius: 26px 26px 0 0; padding: 10px 16px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; animation: rise .24s cubic-bezier(.2,.8,.2,1); }
.grabber { width: 38px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; flex: none; }
.sheethead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.x { width: 34px; height: 34px; border-radius: 50%; background: var(--sunk); display: grid; place-items: center; flex: none; }
.x svg { width: 16px; height: 16px; }
@keyframes rise { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .scrim, .sheet { animation: none; } }
.addgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.addtile { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); padding: 18px 16px; display: flex; flex-direction: column; align-items: flex-start; gap: 12px; text-align: left; font-weight: 700; }
.addtile svg { width: 26px; height: 26px; }
.addtile small { display: block; font-weight: 500; color: var(--ink2); font-size: 12.5px; margin-top: 2px; }
.photo { width: 100%; aspect-ratio: 4 / 3; max-width: 100%; object-fit: cover; border-radius: 20px; background: var(--sunk); display: block; }
.photo-wrap { position: relative; }
.scanline { position: absolute; inset: 0; border-radius: 20px; background: linear-gradient(180deg, transparent 0%, rgba(255,255,255,.4) 48%, rgba(255,255,255,.0) 52%, transparent 100%); background-size: 100% 220%; animation: scan 2s ease-in-out infinite alternate; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .scanline { animation: none; opacity: 0; } }
.titlein { font-size: 24px; font-weight: 800; letter-spacing: -.02em; border: 0; background: transparent; width: 100%; padding: 0; outline: none; }
.titlein:focus { box-shadow: 0 2px 0 var(--ink); }
.stepper { display: inline-flex; align-items: center; gap: 4px; background: var(--card); border-radius: 999px; box-shadow: var(--shadow); padding: 4px; }
.stepper button { width: 32px; height: 32px; border-radius: 50%; background: var(--sunk); font-size: 18px; font-weight: 700; display: grid; place-items: center; }
.stepper span { min-width: 40px; text-align: center; font-weight: 700; }
.ing { display: flex; flex-direction: column; }
.ingrow { display: flex; flex-direction: column; gap: 8px; padding-block: 12px; border-bottom: 1px solid var(--line); }
.ingrow:last-child { border-bottom: 0; }
.ingrow .head { display: flex; justify-content: space-between; gap: 10px; align-items: center; width: 100%; text-align: left; }
.ingrow .n { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.ingrow .p { font-size: 12.5px; color: var(--ink2); }
.ingrow .k { font-weight: 700; white-space: nowrap; }
.conf { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.conf.low { color: var(--carbs); }
.qtys { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.qtys .q { padding: 6px 12px; border-radius: 999px; background: var(--sunk); font-weight: 600; font-size: 13px; }
.qtys .q[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); }
.mini3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mini { background: var(--card); border-radius: var(--r-sm); box-shadow: var(--shadow); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.mini .t { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink2); font-weight: 600; }
.mini .t svg { width: 14px; height: 14px; }
.mini b { font-size: 17px; }
.calrow { display: flex; align-items: center; gap: 12px; }
.calrow .ic { width: 44px; height: 44px; border-radius: 12px; background: var(--sunk); display: grid; place-items: center; }
.calrow .ic svg { width: 22px; height: 22px; }
.calrow b { font-size: 28px; font-weight: 800; letter-spacing: -.02em; }
.sheetfoot { display: flex; gap: 10px; position: sticky; bottom: calc(-20px - env(safe-area-inset-bottom, 0px)); background: var(--bg); padding-block: 10px 4px; }
.sheetfoot .btn { flex: 1; padding: 15px 18px; }

/* Progress */
.stat2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile .k { font-size: 13px; color: var(--ink2); font-weight: 600; }
.tile .v { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.tile .v small { font-size: 14px; font-weight: 600; color: var(--ink2); letter-spacing: 0; }
.meter { height: 8px; border-radius: 4px; background: var(--sunk); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 4px; }
.dots7 { display: flex; gap: 5px; margin-top: 4px; }
.dots7 i { width: 12px; height: 12px; border-radius: 50%; background: var(--sunk); }
.dots7 i.on { background: var(--flame); }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .tick { fill: var(--muted); font-size: 10px; font-family: var(--font); }
.chart .goal { stroke: var(--ink2); stroke-width: 1; }
.chart .goal-l { fill: var(--ink2); font-size: 10px; font-weight: 600; font-family: var(--font); }
.chart .endl { fill: var(--ink); font-size: 11px; font-weight: 700; font-family: var(--font); }
.chart .hl { fill: var(--sunk); }
.chart .xhair { stroke: var(--muted); stroke-width: 1; }
.tip { position: absolute; top: 0; pointer-events: none; background: var(--btn); color: var(--btn-ink); font-size: 12px; font-weight: 600; padding: 6px 9px; border-radius: 9px; white-space: nowrap; transform: translateX(-50%); }
.tip small { display: block; font-weight: 500; opacity: .75; }
details.data summary { font-size: 13px; color: var(--ink2); cursor: pointer; margin-top: 8px; }
details.data .tbl { max-height: 220px; overflow: auto; margin-top: 8px; }
details.data table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
details.data td, details.data th { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); }
details.data td:last-child, details.data th:last-child { text-align: right; }
.mline { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; }
.mline .l { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; }
.mline .l svg { width: 16px; height: 16px; }
.mline .meter { grid-column: 1 / -1; }

/* History calendar */
.monthnav { display: flex; align-items: center; justify-content: space-between; }
.monthnav button { width: 36px; height: 36px; border-radius: 50%; background: var(--sunk); display: grid; place-items: center; }
.monthnav button:disabled { opacity: .35; cursor: default; }
.monthnav svg { width: 18px; height: 18px; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px 2px; }
.cal .dh { text-align: center; font-size: 12px; font-weight: 600; color: var(--muted); padding-bottom: 4px; }
.cday { display: grid; place-items: center; padding: 2px 0; border-radius: 12px; }
.cday .dial { position: relative; width: 38px; height: 38px; }
.cday .dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.cday .dial span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13.5px; font-weight: 600; }
.cday[aria-pressed="true"] .dial span { background: var(--btn); color: var(--btn-ink); border-radius: 50%; margin: 5px; }
.cday.today .dial span { font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }
.cday:disabled { opacity: .3; cursor: default; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.dayrow { display: flex; align-items: center; gap: 12px; padding-block: 10px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
.dayrow:last-child { border-bottom: 0; }
.dayrow .thumb { width: 48px; height: 48px; border-radius: 12px; }
.dayrow .thumb svg { width: 20px; height: 20px; }
.dayrow .t { flex: 1; min-width: 0; }
.dayrow .t div { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dayrow .t small { color: var(--ink2); }

@media (max-width: 380px) {
  .hero .num { font-size: 40px; }
  .mcard { padding: 12px 10px; }
  .mcard .num { font-size: 18px; }
}
</style>

  // Daily calories: one series, columns from a zero baseline, goal as a labeled reference line.
  function calorieChart(days, goal) {
    const W = 340, H = 180, pl = 34, pr = 10, pt = 14, pb = 22, pw = W - pl - pr, ph = H - pt - pb;
    const vals = days.map((k) => dayTotals(k).kcal);
    const max = Math.max(goal * 1.15, ...vals, 1), step = niceStep(max / 3), top = Math.ceil(max / step) * step;
    const y = (v) => pt + ph - (v / top) * ph;
    const band = pw / days.length, bw = Math.max(1, Math.min(24, days.length <= 7 ? band * 0.55 : band - 2));
    let s = "";
    for (let t = 0; t <= top + 1e-6; t += step) s += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}"/><text class="tick" x="${pl - 6}" y="${y(t) + 3.5}" text-anchor="end">${kfmt(t)}</text>`;
    s += `<rect class="hl" id="calHl" y="${pt}" height="${ph}" width="${band}" x="-999" rx="6"/>`;
    vals.forEach((v, i) => {

      const x = pl + i * band + (band - bw) / 2, yt = y(v), yb = pt + ph, r = Math.min(4, bw / 2, yb - yt);
      s += `<path fill="var(--ink)" d="M${x},${yb} V${yt + r} Q${x},${yt} ${x + r},${yt} H${x + bw - r} Q${x + bw},${yt} ${x + bw},${yt + r} V${yb} Z"/>`;
    });
    s += `<line class="goal" x1="${pl}" x2="${W - pr}" y1="${y(goal)}" y2="${y(goal)}"/><text class="goal-l" x="${W - pr}" y="${y(goal) - 4}" text-anchor="end">Goal ${fmt(goal)}</text>`;
    const every = days.length <= 7 ? 1 : days.length <= 31 ? 7 : 30;
    days.forEach((k, i) => {
      const idxFromEnd = days.length - 1 - i;
      if (idxFromEnd % every) return;
      const d = fromKey(k);
      const lbl = days.length <= 7 ? d.toLocaleDateString(undefined, { weekday: "narrow" }) : d.toLocaleDateString(undefined, { month: "numeric", day: "numeric" });
      s += `<text class="tick" x="${pl + i * band + band / 2}" y="${H - 6}" text-anchor="middle">${lbl}</text>`;
    });
    const svg = svgNode(s, W, H, `Daily calories for the last ${days.length} days`);
    const tip = el("div", { class: "tip", hidden: true });
    const wrap = el("div", { class: "chart" }, svg, tip);
    const hl = svg.querySelector("#calHl");
    const move = (e) => {
      const r = svg.getBoundingClientRect(), sx = ((e.clientX - r.left) / r.width) * W;

      hl.setAttribute("x", pl + i * band);

      tip.replaceChildren(el("span", {}, v ? `${fmt(v)} kcal` : "Nothing logged"), el("small", {}, dayName(days[i]) + (v ? ` · ${diff > 0 ? fmt(diff) + " over" : fmt(-diff) + " under"} goal` : "")));
      tip.hidden = false;
      const px = ((pl + i * band + band / 2) / W) * r.width;
      tip.style.left = Math.min(Math.max(px, 70), r.width - 70) + "px";

  }

  // Weight: one series over time, 2px line with a light wash, end dot + end label, optional goal reference line.
  function weightChart(points, startKey, u, goalU) {
    const W = 340, H = 190, pl = 34, pr = 44, pt = 16, pb = 22, pw = W - pl - pr, ph = H - pt - pb;
    const endKey = today(), span = Math.max(1, daysBetween(startKey, endKey));
    const vals = points.map((p) => p.v);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if (goalU && Math.abs(goalU - lo) < (hi - lo + 10) * 1.5) { lo = Math.min(lo, goalU); hi = Math.max(hi, goalU); }
    const step = niceStep(Math.max(hi - lo, 1) / 3);
    lo = Math.floor(lo / step) * step - (lo % step === 0 ? step : 0); hi = Math.ceil(hi / step) * step;
    const x = (k) => pl + (daysBetween(startKey, k) / span) * pw, y = (v) => pt + ph - ((v - lo) / (hi - lo)) * ph;

    if (goalU && goalU >= lo && goalU <= hi) s += `<line class="goal" x1="${pl}" x2="${W - pr}" y1="${y(goalU)}" y2="${y(goalU)}"/><text class="goal-l" x="${pl + 4}" y="${y(goalU) - 4}">Goal ${goalU.toFixed(1)}</text>`;

    s += `<path d="${line}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    s += `<line class="xhair" id="wX" y1="${pt}" y2="${pt + ph}" x1="-999" x2="-999"/><circle id="wDot" r="5" cx="-999" cy="0" fill="var(--ink)" stroke="var(--card)" stroke-width="2"/>`;
    s += `<circle r="5" cx="${x(last.k)}" cy="${y(last.v)}" fill="var(--ink)" stroke="var(--card)" stroke-width="2"/><text class="endl" x="${x(last.k) + 8}" y="${y(last.v) + 4}">${last.v.toFixed(1)}</text>`;
    const ticks = [startKey, addDays(startKey, Math.round(span / 2)), endKey];
    ticks.forEach((k, i) => { s += `<text class="tick" x="${x(k)}" y="${H - 6}" text-anchor="${["start", "middle", "end"][i]}">${fromKey(k).toLocaleDateString(undefined, { month: "short", day: "numeric" })}</text>`; });
    const svg = svgNode(s, W, H, `Weight in ${u}`);
    const tip = el("div", { class: "tip", hidden: true }), wrap = el("div", { class: "chart" }, svg, tip);
    const xh = svg.querySelector("#wX"), dot = svg.querySelector("#wDot");
    const move = (e) => {
      const r = svg.getBoundingClientRect(), sx = ((e.clientX - r.left) / r.width) * W;

      const px = x(best.k);
      xh.setAttribute("x1", px); xh.setAttribute("x2", px); dot.setAttribute("cx", px); dot.setAttribute("cy", y(best.v));
      tip.replaceChildren(el("span", {}, `${best.v.toFixed(1)} ${u}`), el("small", {}, dayName(best.k, "short")));
      tip.hidden = false; tip.style.left = Math.min(Math.max((px / W) * r.width, 50), r.width - 50) + "px"; tip.style.top = "-10px";
    };
    svg.addEventListener("pointermove", move); svg.addEventListener("pointerdown", move);

    if (d && d.day === S.day && (d.phase === "thinking" || d.phase === "review")) {
      list.append(el("button", { class: `card meal${d.phase === "thinking" ? " analyzing" : ""}`, onclick: () => openSheet("draft") },
        d.previewUrl ? el("img", { class: "thumb", src: d.previewUrl, alt: "" }) : el("div", { class: "thumb" }, ico("text")),
        el("div", { class: "body" }, el("div", { class: "top" }, el("div", { class: "name" }, d.phase === "thinking" ? "Analyzing…" : d.name || "Ready to review"), el("span", { class: "chip" }, d.phase === "thinking" ? "Working" : "Tap to review")),
          d.phase === "thinking" ? el("div", { class: "bar-ind" }, el("i")) : el("div", { class: "kcal-line tnum" }, ico("flame"), fmt(draftSum(d, "kcal")) + " calories"))));
    }
    for (const m of meals) {
      list.append(el("button", { class: "card meal", onclick: () => openSheet({ type: "meal", id: m.id }) }, thumbNode(m),
        el("div", { class: "body" },
          el("div", { class: "top" }, el("div", { class: "name" }, m.name), el("span", { class: "chip" }, timeOf(m.at))),
          el("div", { class: "kcal-line tnum" }, ico("flame"), fmt(m.kcal) + " calories"),
          el("div", { class: "mrow tnum" }, el("span", {}, ico("protein", "c-protein"), (m.protein || 0) + "g"), el("span", {}, ico("carbs", "c-carbs"), (m.carbs || 0) + "g"), el("span", {}, ico("fat", "c-fat"), (m.fat || 0) + "g")))));
    }
    if (!list.childNodes.length) list.append(el("div", { class: "card empty" }, el("div", { class: "art" }, ico("camera")),
      el("b", {}, S.day === t ? "Nothing logged yet today" : "Nothing logged this day"),
      el("p", {}, "Tap + to scan your plate, describe a meal, or add calories you already know.")));
    return [
      el("header", { class: "apphead" }, el("div", { class: "logo" }, el("span", { class: "logo-mark" }, ico("plate")), "Plate Counter"),
        el("span", { class: "streak tnum", "aria-label": `${cur} day streak` }, ico("flame"), String(cur))),
      week, hero, el("div", { class: "macros3" }, mc("protein", "Protein"), mc("carbs", "Carbs"), mc("fat", "Fats")),
      el("div", { class: "sechead" }, el("h2", {}, S.day === t ? "Logged today" : `Logged ${dayName(S.day)}`), meals.length ? el("span", { class: "small muted tnum" }, `${meals.length} ${meals.length === 1 ? "meal" : "meals"}`) : null),
      list,
    ];
  }

  function seg(opts, cur, set) {
    return el("div", { class: "seg", role: "group" }, opts.map(([v, l]) => el("button", { "aria-pressed": String(cur === v), onclick: () => { set(v); render(); } }, l)));
  }

  function viewProgress() {
    const g = S.settings, u = g.unit, toU = (kg) => (u === "lb" ? kg * KG_LB : kg);
    const t = today(), { cur, best } = streakInfo();
    const W = S.weights, lastW = W[W.length - 1], firstW = W[0];
    // Weight summary
    let weightCard;
    const goalU = g.goalWeight ? toU(g.goalWeight) : null;
    if (lastW) {
      const startU = toU(firstW.kg), nowU = toU(lastW.kg);
      const frac = goalU != null && startU !== goalU ? (startU - nowU) / (startU - goalU) : null;
      weightCard = el("div", { class: "card tile" }, el("div", { class: "k" }, "Current weight"),
        el("div", { class: "v tnum" }, nowU.toFixed(1), el("small", {}, " " + u)),
        goalU != null ? el("div", { class: "meter", style: "margin-top:6px" }, el("i", { style: `width:${Math.round(Math.max(0, Math.min(1, frac || 0)) * 100)}%;background:var(--ink)` })) : null,
        el("div", { class: "small muted" }, goalU != null ? `Goal ${goalU.toFixed(1)} ${u}` : "Set a goal in Settings"));
    } else {
      weightCard = el("div", { class: "card tile" }, el("div", { class: "k" }, "Current weight"), el("div", { class: "v" }, "—"), el("button", { class: "btn sm", style: "align-self:flex-start;margin-top:4px", onclick: () => openSheet("weight") }, "Log weight"));
    }
    const last7 = Array.from({ length: 7 }, (_, i) => addDays(t, i - 6));
    const streakCard = el("div", { class: "card tile" }, el("div", { class: "k" }, "Day streak"),
      el("div", { class: "row", style: "gap:6px" }, el("span", { style: "color:var(--flame);display:flex" }, ico("flame", "ico")), el("div", { class: "v tnum" }, String(cur))),
      el("div", { class: "dots7", "aria-label": "Days logged this week" }, last7.map((k) => el("i", { class: dayTotals(k).count ? "on" : "", title: dayName(k, "short") }))),
      el("div", { class: "small muted" }, `Best: ${best} ${best === 1 ? "day" : "days"}`));

    // Weight chart
    const wStart = S.wRange === 0 ? (firstW ? firstW.date : addDays(t, -30)) : addDays(t, -S.wRange);
    const pts = W.filter((w) => w.date >= wStart).map((w) => ({ k: w.date, v: toU(w.kg) }));
    const wChange = pts.length >= 2 ? pts[pts.length - 1].v - pts[0].v : null;
    const weightChartCard = el("div", { class: "card stack" },
      el("div", { class: "row between" }, el("div", {}, el("h2", {}, "Weight"), el("div", { class: "small muted tnum" }, wChange == null ? "Log at least twice to see a trend" : `${wChange > 0 ? "+" : wChange < 0 ? "−" : "±"}${Math.abs(wChange).toFixed(1)} ${u} in this period`)),
        el("button", { class: "btn sm ghost", onclick: () => openSheet("weight") }, ico("plus", "ico"), "Log")),
      seg([[30, "30D"], [90, "90D"], [365, "1Y"], [0, "All"]], S.wRange, (v) => { S.wRange = v; }),
      pts.length >= 2 ? weightChart(pts, pts.length && S.wRange === 0 ? pts[0].k : wStart, u, goalU) : el("div", { class: "empty" }, el("div", { class: "art" }, ico("scale")), el("p", {}, pts.length ? "One entry so far. Log again in a few days to draw your trend line." : "No weight entries in this period.")));

    // Calories chart
    const n = S.calRange, days = Array.from({ length: n }, (_, i) => addDays(t, i - (n - 1)));
    const logged = days.filter((k) => dayTotals(k).count);
    const avg = logged.length ? logged.reduce((a, k) => a + dayTotals(k).kcal, 0) / logged.length : 0;
    const onTarget = logged.filter((k) => dayTotals(k).kcal <= g.goal).length;
    const calCard = el("div", { class: "card stack" },
      el("div", {}, el("h2", {}, "Calories"), el("div", { class: "small muted tnum" }, logged.length ? `Averaging ${fmt(avg)} kcal on ${logged.length} logged ${logged.length === 1 ? "day" : "days"} · at or under goal on ${onTarget}` : "No meals logged in this period")),
      seg([[7, "7D"], [30, "30D"], [90, "90D"]], S.calRange, (v) => { S.calRange = v; }),
      calorieChart(days, g.goal));

    // Macro averages
    const mAvg = (k) => (logged.length ? logged.reduce((a, d) => a + dayTotals(d)[k], 0) / logged.length : 0);
    const mline = (k, label) => {
      const v = mAvg(k), goal = g[k];
      return el("div", { class: "mline" }, el("div", { class: "l" }, ico(k, "c-" + k), label), el("div", { class: "small muted tnum" }, `${fmt(v)} g avg · ${fmt(goal)} g goal`),
        el("div", { class: "meter" }, el("i", { style: `width:${Math.min(100, Math.round((v / goal) * 100))}%;background:var(--${k})` })));
    };
    const macroCard = el("div", { class: "card stack" }, el("div", {}, el("h2", {}, "Macros"), el("div", { class: "small muted" }, `Daily average over the same ${n} days`)),
      mline("protein", "Protein"), mline("carbs", "Carbs"), mline("fat", "Fats"));

    const allDays = S.byDay.size, allMeals = S.meals.length;
    const totals = el("div", { class: "stat3" },
      el("div", { class: "card tile" }, el("div", { class: "k" }, "Meals logged"), el("div", { class: "v tnum" }, fmt(allMeals))),
      el("div", { class: "card tile" }, el("div", { class: "k" }, "Days logged"), el("div", { class: "v tnum" }, fmt(allDays))),
      el("div", { class: "card tile" }, el("div", { class: "k" }, "Weigh-ins"), el("div", { class: "v tnum" }, fmt(W.length))));

    return [el("h1", {}, "Progress"), el("div", { class: "stat2" }, weightCard, streakCard), calCard, weightChartCard, macroCard, totals];
  }

  function viewHistory() {
    const t = today(), g = S.settings;
    const [yy, mm] = S.month.split("-").map(Number);
    const first = new Date(yy, mm - 1, 1), nDays = new Date(yy, mm, 0).getDate();
    const monthDays = Array.from({ length: nDays }, (_, i) => dateKey(new Date(yy, mm - 1, i + 1)));
    const logged = monthDays.filter((k) => dayTotals(k).count);
    const avg = logged.length ? logged.reduce((a, k) => a + dayTotals(k).kcal, 0) / logged.length : 0;
    const under = logged.filter((k) => dayTotals(k).kcal <= g.goal).length;
    const shift = (n) => { const d = new Date(yy, mm - 1 + n, 1); S.month = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; render(); };
    const cal = el("div", { class: "cal" });
    const dows = Array.from({ length: 7 }, (_, i) => new Date(2024, 8, 1 + i).toLocaleDateString(undefined, { weekday: "narrow" }));
    dows.forEach((d) => cal.append(el("div", { class: "dh", "aria-hidden": "true" }, d)));
    for (let i = 0; i < first.getDay(); i++) cal.append(el("div"));
    for (const k of monthDays) {
      const dt = dayTotals(k);
      cal.append(el("button", { class: "cday" + (k === t ? " today" : ""), disabled: k > t, "aria-pressed": String(k === S.histDay), "aria-label": `${dayName(k)}: ${dt.count ? fmt(dt.kcal) + " kcal" : "nothing logged"}`, onclick: () => { S.histDay = k; render(); } },
        el("div", { class: "dial" }, ringSvg(38, 3, dt.kcal / g.goal, dayColor(k), dt.count ? "var(--line)" : "transparent"), el("span", { class: "tnum" }, String(fromKey(k).getDate())))));
    }
    const hd = S.histDay, ht = dayTotals(hd);
    const dm = S.meals.filter((m) => m.date === hd).sort((a, b) => String(a.at).localeCompare(String(b.at)));
    const dayCard = el("div", { class: "card stack" },
      el("div", { class: "row between" }, el("div", {}, el("h2", {}, dayName(hd)), el("div", { class: "small muted tnum" }, ht.count ? `${fmt(ht.kcal)} kcal · P ${fmt(ht.protein)}g · C ${fmt(ht.carbs)}g · F ${fmt(ht.fat)}g` : "Nothing logged")),
        el("button", { class: "btn sm ghost", onclick: () => { S.day = hd; S.tab = "home"; render(); window.scrollTo(0, 0); } }, "Open day")),
      dm.length ? el("div", {}, dm.map((m) => el("button", { class: "dayrow", onclick: () => openSheet({ type: "meal", id: m.id }) }, thumbNode(m),
        el("div", { class: "t" }, el("div", {}, m.name), el("small", {}, `${SLOT_LABEL[m.slot] || "Snack"} · ${timeOf(m.at)}`)), el("b", { class: "tnum" }, fmt(m.kcal))))) : null);
    const nowMonth = t.slice(0, 7);
    return [
      el("h1", {}, "History"),
      el("div", { class: "card stack" },
        el("div", { class: "monthnav" }, el("button", { "aria-label": "Previous month", onclick: () => shift(-1) }, ico("left")),
          el("h2", {}, first.toLocaleDateString(undefined, { month: "long", year: "numeric" })),
          el("button", { "aria-label": "Next month", disabled: S.month >= nowMonth, onclick: () => shift(1) }, ico("right"))),
        el("div", { class: "small muted tnum", style: "text-align:center" }, logged.length ? `${logged.length} days logged · ${fmt(avg)} kcal average · ${under} at or under goal` : "No meals logged this month"),
        cal,
        el("div", { class: "legend" }, el("span", {}, el("i", { style: "background:var(--ink)" }), "Ring fills toward your goal"), el("span", {}, el("i", { style: "background:var(--over)" }), "Over goal"))),
      dayCard,
    ];
  }

  function viewSettings() {
    const g = S.settings;
    const num = (id, label, v, extra = {}) => el("div", { class: "field" }, el("label", { for: id }, label), el("input", { class: "input tnum", id, type: "number", inputmode: "decimal", value: v ?? "", ...extra }));
    const saved = el("span", { class: "small muted", hidden: true }, "Saved");
    const goals = el("form", { class: "card stack", onsubmit: async (e) => {
      e.preventDefault();
      g.goal = Math.min(Math.max(int($("sG").value) || 2000, 800), 6000);
      g.protein = int($("sP").value, 500) || 1; g.carbs = int($("sC").value, 800) || 1; g.fat = int($("sF").value, 400) || 1;
      try { await store.saveSettings(g); saved.hidden = false; setTimeout(() => (saved.hidden = true), 1800); } catch {}
      renderTabs();
    } },
      el("h2", {}, "Daily goals"),
      num("sG", "Calories", g.goal, { min: 800, max: 6000, step: 10 }),
      el("div", { class: "row", style: "align-items:stretch" }, num("sP", "Protein (g)", g.protein, { min: 1 }), num("sC", "Carbs (g)", g.carbs, { min: 1 }), num("sF", "Fats (g)", g.fat, { min: 1 })),
      el("button", { class: "btn ghost sm", type: "button", style: "align-self:flex-start", onclick: () => {
        const c = int($("sG").value) || 2000;
        $("sP").value = Math.round((c * 0.3) / 4); $("sC").value = Math.round((c * 0.4) / 4); $("sF").value = Math.round((c * 0.3) / 9);
      } }, "Split calories 30 / 40 / 30"),
      el("p", { class: "small muted" }, "The split sets protein 30%, carbs 40% and fats 30% of your calories (4 kcal per gram of protein or carbs, 9 per gram of fat)."),
      el("div", { class: "row" }, el("button", { class: "btn", type: "submit" }, "Save goals"), saved));
    const u = g.unit, toU = (kg) => (u === "lb" ? kg * KG_LB : kg);
    const saved2 = el("span", { class: "small muted", hidden: true }, "Saved");
    const body = el("form", { class: "card stack", onsubmit: async (e) => {
      e.preventDefault();
      const v = Number($("sW").value);
      g.goalWeight = v > 0 ? Math.round((g.unit === "lb" ? v / KG_LB : v) * 100) / 100 : null;
      try { await store.saveSettings(g); saved2.hidden = false; setTimeout(() => (saved2.hidden = true), 1800); } catch {}
    } },
      el("h2", {}, "Body"),
      el("div", { class: "field" }, el("label", {}, "Units"), el("div", { class: "seg", role: "group", "aria-label": "Weight units" },
        [["lb", "Pounds (lb)"], ["kg", "Kilograms (kg)"]].map(([v, l]) => el("button", { type: "button", "aria-pressed": String(u === v), onclick: async () => { g.unit = v; await store.saveSettings(g).catch(() => {}); renderTabs(true); } }, l)))),
      num("sW", `Goal weight (${u})`, g.goalWeight ? toU(g.goalWeight).toFixed(1) : "", { step: "0.1", min: 0 }),
      el("div", { class: "row" }, el("button", { class: "btn", type: "submit" }, "Save"), saved2));
    const about = el("div", { class: "card stack" }, el("h2", {}, "About your data"),
      el("p", { class: "small muted" }, S.storeMode === "db"
        ? "Meals, photos and weights are saved to your Claude account under a private path. Only you can read them, on any device where you open this page."
        : "Your log is saved in this browser only. Open this page in Claude while signed in to keep it on your account."),
      el("p", { class: "small muted" }, "Photo and text estimates run on your own Claude plan, so there's no subscription. Estimates are usually within 15–25% of the true value; hidden oil, butter and dressings cause the biggest misses, so mention them when you can."));
    return [el("h1", {}, "Settings"), goals, body, about];
  }

  // ================= render =================
  function renderTabs(force) { if (S.tab !== "settings" || force) paint(); }
  function paint() {
    const v = $("view");
    const views = { home: viewHome, progress: viewProgress, history: viewHistory, settings: viewSettings };
    const nodes = views[S.tab]();
    if (S.storeError) nodes.push(el("p", { class: "note" }, "Lost the connection to your saved log. Reload the page to reconnect."));
    v.replaceChildren(...nodes.filter(Boolean));
    document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-current", b.dataset.tab === S.tab ? "page" : "false"));
  }
  // Settings has live form fields, so background updates don't repaint it.
  function render() { renderTabs(false); }
  function renderAll() { paint(); renderSheet(); }

  // ================= wiring =================
  const TAB_LABEL = { home: "Home", progress: "Progress", history: "History", settings: "Settings" };
  document.querySelectorAll(".tab").forEach((b) => {
    b.append(ico(b.dataset.tab), el("span", {}, TAB_LABEL[b.dataset.tab]));
    b.onclick = () => { S.tab = b.dataset.tab; if (S.tab === "history") S.histDay = S.day; paint(); window.scrollTo(0, 0); };
  });
  $("fab").append(ico("plus"));
  $("fab").onclick = () => openSheet("add");
  $("photoInput").onchange = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    startDraft("photo", { file, previewUrl: URL.createObjectURL(file) });
    const d = S.draft;
    d.photo = await makeImage(file, 360, false);
  };
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.sheet) closeSheet(); });

  async function boot() {
    subscribeAll();
    paint();
    const C = window.claude;
    const [s, db, user] = C ? await Promise.all([C.use("sample"), C.use("db"), C.use("user")]) : [null, null, null];
    sample = s;
    if (sample) { const caps = await sample.limits().catch(() => null); canImages = !!(caps && caps.images); }
    const uid = user ? await user.id() : null;
    if (db && uid) { store = dbStore(db, uid); S.storeMode = "db"; }
    try { Object.assign(S.settings, await store.getSettings()); } catch {}
    subscribeAll();
    paint(); renderSheet();
  }
  boot();
})();
</script>
