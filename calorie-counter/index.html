<title>Plate Counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: a phone app shell. One scrolling screen per tab, a bottom tab bar, a floating add button, and bottom sheets for every task. */
:root {
  --bg: #f4f4f6;
  --card: #ffffff;
  --sunk: #efeff2;
  --ink: #111114;
  --ink2: #5c5c66;
  --muted: #8e8e97;
  --line: #e6e6ea;
  --btn: #111114;
  --btn-ink: #ffffff;
  --protein: #d93d6b;
  --carbs: #c98900;
  --fat: #2f6fe8;
  --flame: #f06a1d;
  --good: #1f9d55;
  --over: #d63a2f;
  --water: #0f8fa3;
  --xp: #7c5cff;
  --coin: #d99a00;
  --edge: rgba(17, 17, 20, .05);
  --numf: ui-rounded, "SF Pro Rounded", "Nunito", -apple-system, BlinkMacSystemFont, sans-serif;
  --shadow: 0 1px 2px rgba(17, 17, 20, .04), 0 6px 20px rgba(17, 17, 20, .06);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
  --r-card: 22px;
  --r-sm: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --card: #1c1c1e; --sunk: #2a2a2e; --ink: #f5f5f7; --ink2: #aeaeb6; --muted: #7c7c85;
    --line: #2c2c30; --btn: #f5f5f7; --btn-ink: #000000;
    --protein: #e0588a; --carbs: #bf8710; --fat: #5b8cec; --flame: #ff8a3d; --good: #46c37b; --over: #ff6b5e; --water: #3cc9da; --xp: #9d85ff; --coin: #f2c14e; --edge: rgba(255, 255, 255, .06);
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --card: #1c1c1e; --sunk: #2a2a2e; --ink: #f5f5f7; --ink2: #aeaeb6; --muted: #7c7c85;
  --line: #2c2c30; --btn: #f5f5f7; --btn-ink: #000000;
  --protein: #e0588a; --carbs: #bf8710; --fat: #5b8cec; --flame: #ff8a3d; --good: #46c37b; --over: #ff6b5e; --water: #3cc9da; --xp: #9d85ff; --coin: #f2c14e; --edge: rgba(255, 255, 255, .06);
  --shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 30px; font-weight: 800; letter-spacing: -.02em; text-wrap: balance; }
h2 { font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink2); }
.small { font-size: 13px; }
.ico { width: 20px; height: 20px; flex: none; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.shell { max-width: 480px; margin: 0 auto; padding: 0 16px; padding-block: 12px 150px; min-height: 100%; }
.view { display: flex; flex-direction: column; gap: 16px; }

.card { background: var(--card); border-radius: var(--r-card); box-shadow: var(--shadow); padding: 18px; }
.card.flat { box-shadow: none; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* Header */
.apphead { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 4px; }
.logo { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 21px; letter-spacing: -.02em; }
.logo-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--btn); color: var(--btn-ink); display: grid; place-items: center; }
.logo-mark svg { width: 18px; height: 18px; }
.streak { display: inline-flex; align-items: center; gap: 5px; background: var(--card); box-shadow: var(--shadow); border-radius: 999px; padding: 6px 12px 6px 9px; font-weight: 700; }
.streak svg { color: var(--flame); width: 18px; height: 18px; }

/* Week strip */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0 8px; border-radius: 16px; }
.wd[aria-current="date"] { background: var(--card); box-shadow: var(--shadow); }
.wd .dow { font-size: 12px; font-weight: 600; color: var(--muted); }
.wd .dial { position: relative; width: 38px; height: 38px; }
.wd .dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.wd .dial span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 14px; font-weight: 700; }
.wd:disabled { opacity: .35; cursor: default; }

/* Summary cards */
.hero { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 22px; }
.hero .num { font-size: 46px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
.hero .lbl { font-size: 15px; color: var(--ink2); margin-top: 6px; font-weight: 500; }
.hero .sub { font-size: 13px; color: var(--muted); margin-top: 10px; }
.ring { position: relative; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
.ring .mid { position: absolute; inset: 0; display: grid; place-items: center; }
.ring .mid svg { width: 26px; height: 26px; transform: none; }
.mcard .ring .mid svg { width: 20px; height: 20px; }
.macros3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.mcard { padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.mcard .num { font-size: 21px; font-weight: 800; letter-spacing: -.02em; }
.mcard .lbl { font-size: 12.5px; color: var(--ink2); font-weight: 500; }
.mcard .ring { align-self: center; }

.sechead { display: flex; align-items: baseline; justify-content: space-between; padding-top: 6px; }

/* Meal cards */
.meal { display: flex; gap: 12px; padding: 10px; align-items: stretch; text-align: left; width: 100%; }
.thumb { width: 84px; height: 84px; border-radius: 16px; object-fit: cover; background: var(--sunk); flex: none; display: grid; place-items: center; color: var(--muted); overflow: hidden; }
.thumb svg { width: 28px; height: 28px; }
.meal .body { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
.meal .top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.meal .name { font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.chip { font-size: 12px; font-weight: 600; color: var(--ink2); background: var(--sunk); border-radius: 999px; padding: 3px 8px; white-space: nowrap; flex: none; }
.kcal-line { display: flex; align-items: center; gap: 5px; font-weight: 700; font-size: 15px; }
.kcal-line svg { width: 16px; height: 16px; color: var(--ink); }
.mrow { display: flex; gap: 12px; font-size: 13px; color: var(--ink2); font-weight: 600; flex-wrap: wrap; }
.mrow span { display: inline-flex; align-items: center; gap: 4px; }
.mrow svg { width: 14px; height: 14px; }
.c-protein { color: var(--protein); } .c-carbs { color: var(--carbs); } .c-fat { color: var(--fat); }
.analyzing { position: relative; }
.analyzing::after { content: ""; position: absolute; top: 10px; left: 10px; height: 84px; width: 84px; border-radius: 16px; background: linear-gradient(180deg, transparent 0%, rgba(255,255,255,.55) 50%, transparent 100%); background-size: 100% 200%; animation: scan 1.6s ease-in-out infinite; }
@keyframes scan { 0% { background-position: 0 -100%; } 100% { background-position: 0 100%; } }
.bar-ind { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; position: relative; }
.bar-ind i { position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 3px; background: var(--ink); animation: slide 1.3s ease-in-out infinite; }
@keyframes slide { 0% { left: -40%; } 100% { left: 100%; } }
@media (prefers-reduced-motion: reduce) { .analyzing::after, .bar-ind i { animation: none; } .bar-ind i { left: 0; width: 100%; opacity: .35; } }

.empty { text-align: center; padding: 28px 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.empty .art { width: 56px; height: 56px; border-radius: 18px; background: var(--sunk); display: grid; place-items: center; color: var(--ink2); }
.empty .art svg { width: 28px; height: 28px; }
.empty b { font-size: 16px; }
.empty p { color: var(--ink2); font-size: 14px; max-width: 30ch; }

/* Buttons & inputs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; padding: 13px 20px; font-weight: 700; font-size: 15px; background: var(--btn); color: var(--btn-ink); }
.btn.block { width: 100%; padding: 16px 20px; font-size: 16px; }
.btn.ghost { background: var(--sunk); color: var(--ink); }
.btn.line { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.danger { background: transparent; color: var(--over); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.sm { padding: 8px 14px; font-size: 13.5px; }
.btn:disabled { opacity: .45; cursor: default; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 120px; }
.field label { font-size: 13px; font-weight: 600; color: var(--ink2); }
.stack > .field, .sheet > .field { flex: none; }
.input { width: 100%; border: 0; border-radius: var(--r-sm); background: var(--sunk); padding: 13px 14px; font-size: 16px; outline: none; }
.input:focus { box-shadow: inset 0 0 0 1.5px var(--ink); }
textarea.input { resize: vertical; min-height: 80px; }
.seg { display: flex; background: var(--sunk); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { flex: 1; padding: 7px 10px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--ink2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.err { color: var(--over); font-size: 14px; font-weight: 500; }
.note { font-size: 13.5px; color: var(--ink2); background: var(--sunk); border-radius: var(--r-sm); padding: 10px 12px; }

/* Tab bar & FAB */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr) 68px; align-items: center; padding: 6px 8px 8px; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--muted); padding: 4px 0; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--ink); }
.fab { width: 58px; height: 58px; border-radius: 50%; background: var(--btn); color: var(--btn-ink); display: grid; place-items: center; justify-self: center; margin-top: -26px; box-shadow: 0 8px 22px rgba(0,0,0,.25); }
.fab svg { width: 28px; height: 28px; }

/* Sheets */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.42); display: flex; align-items: flex-end; justify-content: center; animation: fade .18s ease-out; }
.sheet { background: var(--bg); width: 100%; max-width: 480px; max-height: 92%; overflow-y: auto; border-radius: 26px 26px 0 0; padding: 10px 16px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; animation: rise .24s cubic-bezier(.2,.8,.2,1); }
.grabber { width: 38px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; flex: none; }
.sheethead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.x { width: 34px; height: 34px; border-radius: 50%; background: var(--sunk); display: grid; place-items: center; flex: none; }
.x svg { width: 16px; height: 16px; }
@keyframes rise { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .scrim, .sheet { animation: none; } }
.addgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.addtile { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); padding: 18px 16px; display: flex; flex-direction: column; align-items: flex-start; gap: 12px; text-align: left; font-weight: 700; }
.addtile svg { width: 26px; height: 26px; }
.addtile small { display: block; font-weight: 500; color: var(--ink2); font-size: 12.5px; margin-top: 2px; }
.photo { width: 100%; aspect-ratio: 4 / 3; max-width: 100%; object-fit: cover; border-radius: 20px; background: var(--sunk); display: block; }
.photo-wrap { position: relative; }
.scanline { position: absolute; inset: 0; border-radius: 20px; background: linear-gradient(180deg, transparent 0%, rgba(255,255,255,.4) 48%, rgba(255,255,255,.0) 52%, transparent 100%); background-size: 100% 220%; animation: scan 2s ease-in-out infinite alternate; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .scanline { animation: none; opacity: 0; } }
.titlein { font-size: 24px; font-weight: 800; letter-spacing: -.02em; border: 0; background: transparent; width: 100%; padding: 0; outline: none; }
.titlein:focus { box-shadow: 0 2px 0 var(--ink); }
.stepper { display: inline-flex; align-items: center; gap: 4px; background: var(--card); border-radius: 999px; box-shadow: var(--shadow); padding: 4px; }
.stepper button { width: 32px; height: 32px; border-radius: 50%; background: var(--sunk); font-size: 18px; font-weight: 700; display: grid; place-items: center; }
.stepper span { min-width: 40px; text-align: center; font-weight: 700; }
.ing { display: flex; flex-direction: column; }
.ingrow { display: flex; flex-direction: column; gap: 8px; padding-block: 12px; border-bottom: 1px solid var(--line); }
.ingrow:last-child { border-bottom: 0; }
.ingrow .head { display: flex; justify-content: space-between; gap: 10px; align-items: center; width: 100%; text-align: left; }
.ingrow .n { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.ingrow .p { font-size: 12.5px; color: var(--ink2); }
.ingrow .k { font-weight: 700; white-space: nowrap; }
.conf { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.conf.low { color: var(--carbs); }
.qtys { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.qtys .q { padding: 6px 12px; border-radius: 999px; background: var(--sunk); font-weight: 600; font-size: 13px; }
.qtys .q[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); }
.mini3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mini { background: var(--card); border-radius: var(--r-sm); box-shadow: var(--shadow); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.mini .t { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink2); font-weight: 600; }
.mini .t svg { width: 14px; height: 14px; }
.mini b { font-size: 17px; }
.calrow { display: flex; align-items: center; gap: 12px; }
.calrow .ic { width: 44px; height: 44px; border-radius: 12px; background: var(--sunk); display: grid; place-items: center; }
.calrow .ic svg { width: 22px; height: 22px; }
.calrow b { font-size: 28px; font-weight: 800; letter-spacing: -.02em; }
.sheetfoot { display: flex; gap: 10px; position: sticky; bottom: calc(-20px - env(safe-area-inset-bottom, 0px)); background: var(--bg); padding-block: 10px 4px; }
.sheetfoot .btn { flex: 1; padding: 15px 18px; }

/* Progress */
.stat2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile .k { font-size: 13px; color: var(--ink2); font-weight: 600; }
.tile .v { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.tile .v small { font-size: 14px; font-weight: 600; color: var(--ink2); letter-spacing: 0; }
.meter { height: 8px; border-radius: 4px; background: var(--sunk); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 4px; }
.dots7 { display: flex; gap: 5px; margin-top: 4px; }
.dots7 i { width: 12px; height: 12px; border-radius: 50%; background: var(--sunk); }
.dots7 i.on { background: var(--flame); }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .tick { fill: var(--muted); font-size: 10px; font-family: var(--font); }
.chart .goal { stroke: var(--ink2); stroke-width: 1; }
.chart .goal-l { fill: var(--ink2); font-size: 10px; font-weight: 600; font-family: var(--font); }
.chart .endl { fill: var(--ink); font-size: 11px; font-weight: 700; font-family: var(--font); }
.chart .hl { fill: var(--sunk); }
.chart .xhair { stroke: var(--muted); stroke-width: 1; }
.tip { position: absolute; top: 0; pointer-events: none; background: var(--btn); color: var(--btn-ink); font-size: 12px; font-weight: 600; padding: 6px 9px; border-radius: 9px; white-space: nowrap; transform: translateX(-50%); }
.tip small { display: block; font-weight: 500; opacity: .75; }
details.data summary { font-size: 13px; color: var(--ink2); cursor: pointer; margin-top: 8px; }
details.data .tbl { max-height: 220px; overflow: auto; margin-top: 8px; }
details.data table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
details.data td, details.data th { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); }
details.data td:last-child, details.data th:last-child { text-align: right; }
.mline { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; }
.mline .l { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; }
.mline .l svg { width: 16px; height: 16px; }
.mline .meter { grid-column: 1 / -1; }

/* History calendar */
.monthnav { display: flex; align-items: center; justify-content: space-between; }
.monthnav button { width: 36px; height: 36px; border-radius: 50%; background: var(--sunk); display: grid; place-items: center; }
.monthnav button:disabled { opacity: .35; cursor: default; }
.monthnav svg { width: 18px; height: 18px; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px 2px; }
.cal .dh { text-align: center; font-size: 12px; font-weight: 600; color: var(--muted); padding-bottom: 4px; }
.cday { display: grid; place-items: center; padding: 2px 0; border-radius: 12px; }
.cday .dial { position: relative; width: 38px; height: 38px; }
.cday .dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.cday .dial span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13.5px; font-weight: 600; }
.cday[aria-pressed="true"] .dial span { background: var(--btn); color: var(--btn-ink); border-radius: 50%; margin: 5px; }
.cday.today .dial span { font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }
.cday:disabled { opacity: .3; cursor: default; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.dayrow { display: flex; align-items: center; gap: 12px; padding-block: 10px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
.dayrow:last-child { border-bottom: 0; }
.dayrow .thumb { width: 48px; height: 48px; border-radius: 12px; }
.dayrow .thumb svg { width: 20px; height: 20px; }
.dayrow .t { flex: 1; min-width: 0; }
.dayrow .t div { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dayrow .t small { color: var(--ink2); }

/* Recipes, plan, groceries */
.hbtns { display: flex; gap: 8px; align-items: center; }
.iconbtn { width: 38px; height: 38px; border-radius: 50%; background: var(--card); box-shadow: var(--shadow); display: grid; place-items: center; flex: none; }
.iconbtn svg { width: 20px; height: 20px; }
.titlerow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.search { position: relative; }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.search .input { padding-left: 42px; background: var(--card); box-shadow: var(--shadow); }
.rgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.rcard { padding: 0; overflow: hidden; text-align: left; display: flex; flex-direction: column; min-width: 0; }
.rcard .rimg { width: 100%; aspect-ratio: 1 / 1; max-width: 100%; object-fit: cover; background: var(--sunk); display: grid; place-items: center; color: var(--muted); }
.rcard .rimg svg { width: 32px; height: 32px; }
.rcard .rb { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.rcard .rt { font-weight: 700; font-size: 14.5px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.rcard .rm { font-size: 12.5px; color: var(--ink2); font-weight: 600; }
